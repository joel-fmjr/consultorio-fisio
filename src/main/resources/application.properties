spring.application.name=consultorio-fisio
server.port=8000
spring.profiles.active=dev

# Mercado Pago Configuration
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}

# PIX Configuration (optional, defaults shown)
mercadopago.pix.default-expiration-hours=24
mercadopago.pix.min-expiration-hours=0.5
mercadopago.pix.max-expiration-hours=720