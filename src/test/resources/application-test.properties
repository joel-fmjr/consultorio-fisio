# Test Profile - Uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional, for debugging)
spring.h2.console.enabled=false

# JPA/Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Mercado Pago Configuration (test values)
mercadopago.access-token=test_token
mercadopago.webhook-secret=test_secret
mercadopago.pix.default-expiration-hours=24
mercadopago.pix.min-expiration-hours=0.5
mercadopago.pix.max-expiration-hours=720
